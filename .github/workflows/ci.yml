name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reference:
    name: Reference PoC — typecheck & soundness self-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run selftest

  playground:
    name: Playground — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: reference
      - run: npm install
        working-directory: playground
      - run: npm run typecheck
        working-directory: playground
      - run: npm run build
        working-directory: playground

  cross-verify:
    name: Cross-language verify (TS transcript ↔ Python/libsodium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Produce transcripts with the TypeScript engine
        run: npm install && npm run demo
        working-directory: reference
      - name: Re-verify both transcripts with the TypeScript CLI (from file alone)
        run: |
          npm run verify -- out/transcript.json
          npm run verify -- out/ranked.json
        working-directory: reference
      - name: Install libsodium + pysodium
        run: sudo apt-get update && sudo apt-get install -y libsodium23 && pip install pysodium
      - name: Independently verify the plurality transcript (Python/libsodium)
        run: python verifier/vvp-verify-py/vvp_verify.py reference/out/transcript.json
      - name: Independently verify the ranked transcript (Python/libsodium)
        run: python verifier/vvp-verify-py/vvp_verify.py reference/out/ranked.json
