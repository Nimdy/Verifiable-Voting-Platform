name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reference:
    name: Reference PoC — typecheck & soundness self-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run selftest

  playground:
    name: Playground — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: reference
      - run: npm install
        working-directory: playground
      - run: npm run build
        working-directory: playground
